name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit the `v4` tag pointed at on 2026-10-26.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The checksum is of the v0.11.0 release archive, recorded on 2026-10-26.
      - name: Install shellcheck
        run: |
          curl -sSfL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      # `tests/resolve-search.sh` needs `ripgrep`, `sqlite3` is already on the runner.
      - name: Install fish and ripgrep
        run: sudo apt-get update && sudo apt-get install -y fish ripgrep

      - name: Shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0r shellcheck -S warning

      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0r -I{} jq empty {}

      - name: Validate fish syntax
        run: find . -name '*.fish' -not -path './.git/*' -print0 | xargs -0r -n1 fish --no-execute

      # The guard is an ES module, older `node` only parses `export` in a `.mjs` file.
      - name: Validate JavaScript syntax
        run: |
          cp .config/agentic/hooks/opencode-guards.js "$RUNNER_TEMP/opencode-guards.mjs"
          node --check "$RUNNER_TEMP/opencode-guards.mjs"
          # The mods are ES modules in `.js` files, so each is checked as `.mjs`.
          for mod in .config/herdr-app/mods/*/main.js .config/herdr-app/mods/*/logic.js; do
            [ -f "$mod" ] || continue
            cp "$mod" "$RUNNER_TEMP/mod-check.mjs"
            node --check "$RUNNER_TEMP/mod-check.mjs"
          done

      - name: Validate skill frontmatter
        run: .github/scripts/check-skill-frontmatter.sh

      # `tests/dock.sh` needs macOS, it reports a skip on this runner.
      # Runs every test before failing, so one broken test does not hide the rest.
      - name: Run tests
        run: |
          status=0
          for test in tests/*.sh; do
            bash "$test" || status=1
          done
          exit "$status"

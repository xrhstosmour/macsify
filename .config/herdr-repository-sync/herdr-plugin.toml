id = "herdr-repository-sync"
name = "Herdr Repository Sync"
version = "0.1.0"
# `[[startup]]` needs herdr 0.7.5, older herdr ignores the section.
min_herdr_version = "0.7.5"
description = "Run the gfrb fetch and autosquash, autostash rebase onto the origin default branch in every herdr pane checked out on main or master, aborting on conflicts."
platforms = ["macos"]

# Every entry runs the same idempotent, throttled pass over all open pane
# directories, the event name only ends up in the log.
[[startup]]
command = ["bash", "repository-sync.sh", "startup"]

[[events]]
on = "workspace.created"
command = ["bash", "repository-sync.sh", "workspace.created"]

[[events]]
on = "worktree.created"
command = ["bash", "repository-sync.sh", "worktree.created"]

[[events]]
on = "worktree.opened"
command = ["bash", "repository-sync.sh", "worktree.opened"]

[[events]]
on = "tab.created"
command = ["bash", "repository-sync.sh", "tab.created"]

# Sync now, ignoring the throttle. Invoke with
#   herdr plugin action invoke herdr-repository-sync.sync
[[actions]]
id = "sync"
title = "Herdr Repository Sync: sync default branches now"
contexts = ["global"]
command = ["bash", "repository-sync.sh", "--force"]
